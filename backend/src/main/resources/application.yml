spring:
  application:
    name: distributed-stock-exchange-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/stock_exchange}
    username: ${DB_USER:stock_user}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
